---
- name: Create VLAN 3000 for Engineering on Arista Switch
  hosts: arista-switch
  gather_facts: no
  connection: network_cli

  vars:
    vlan_id: 3000
    vlan_name: "Engineering"

  tasks:
    - name: Create VLAN 3000
      arista.eos.eos_vlans:
        config:
          - vlan_id: "{{ vlan_id }}"
            name: "{{ vlan_name }}"
            state: active
        state: merged
      register: vlan_result

    - name: Show result
      debug:
        msg: "Created VLAN {{ vlan_id }} - {{ vlan_name }}"
      when: vlan_result is changed
